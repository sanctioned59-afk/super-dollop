.tabs{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;background:#000d;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:.5px solid var(--l);padding:6px 4px calc(6px + var(--sb))}.tabs button{flex:1;background:none;border:0;color:var(--s);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.tabs .on{color:var(--b)}

.cmp{bottom:calc(104px + var(--sb))}.card:hover{box-shadow:0 14px 40px #000c,0 0 0 1px rgba(var(--br),0.33),inset 0 1px 0 #ffffff33}.tile:hover{background:#ffffff1f}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}

/* ===== Liquid Glass ===== */
:root{
 --g:rgba(255,255,255,.075);--g2:rgba(255,255,255,.11);--l:rgba(255,255,255,.14);--s:#9a9aa5;
 --glass:rgba(38,40,52,.42);--glass-hi:rgba(255,255,255,.2);--glass-edge:rgba(255,255,255,.22);
 --blur:blur(28px) saturate(190%) brightness(1.05);
 --spec:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px rgba(255,255,255,.2);
 --lift:0 10px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
 --bgfx:radial-gradient(80% 46% at 50% -6%,rgba(185,222,255,.17),transparent 70%),radial-gradient(62% 40% at 0% 40%,rgba(var(--br),.10),transparent 70%),radial-gradient(62% 38% at 100% 94%,rgba(255,122,60,.085),transparent 70%),linear-gradient(180deg,#0b0e15 0%,#07090e 55%,#050608 100%);
}
html,body,#shell{background:#06080d}
.ov{background:var(--bgfx)}
.scr{padding-bottom:calc(120px + var(--sb))}
h1{font-weight:800;letter-spacing:-.8px}

/* cards, tiles, grouped lists: translucent glass slabs */
.tile,.card,.grp,.vals div{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:var(--spec),var(--lift)}
.tile{border-radius:28px}.card{border-radius:30px}.grp{border-radius:24px}.vals div{border-radius:22px}
.card .cb{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.07))}
.art{border-bottom:0;position:relative}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 35%,rgba(0,0,0,.25));pointer-events:none}
.row{border-bottom-color:rgba(255,255,255,.1)}
.ic{border-radius:16px;background:linear-gradient(145deg,var(--b1),var(--b) 55%,var(--b2));box-shadow:inset 0 1px 0 #fff9,0 6px 16px rgba(var(--br),0.33)}
.tile:active,.card:active{transform:scale(.975)}.tile,.card{transition:transform .25s cubic-bezier(.3,1.1,.5,1),box-shadow .2s}

/* controls */
.srch{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:99px;padding:13px 18px;box-shadow:var(--spec)}
.seg{background:rgba(255,255,255,.08);border-radius:99px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.14)}
.seg button{border-radius:99px;padding:8px 4px;transition:background .25s,box-shadow .25s}
.seg .on{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.18));box-shadow:var(--spec),0 3px 10px rgba(0,0,0,.35)}
.chip{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--spec);transition:transform .2s cubic-bezier(.3,1.1,.5,1)}.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(145deg,var(--b1),var(--b) 60%,var(--b2));box-shadow:inset 0 1px 0 #fffa,0 4px 14px rgba(var(--br),0.33)}
.btn{border-radius:99px;background:linear-gradient(145deg,var(--b1),var(--b) 55%,var(--b2));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,120,140,.25),0 10px 28px rgba(var(--br),.3);transition:transform .2s cubic-bezier(.3,1.1,.5,1)}
.btn:active{opacity:1;transform:scale(.97)}
.btn.sec{background:var(--glass);color:#fff;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--spec)}
.hb,.vf{background:rgba(20,22,30,.38);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:var(--spec)}
.hb{transition:transform .2s cubic-bezier(.3,1.1,.5,1)}.hb:active{transform:scale(.85)}
.tag{background:rgba(var(--br),.08)}
.demo{background:rgba(255,214,10,.07);border-radius:16px}
.sw span{background:rgba(120,120,128,.4);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.15)}
.sw span:after{width:27px;height:27px;background:linear-gradient(180deg,#fff,#e8e8ee);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 -1px 2px rgba(0,0,0,.1)}
.ph div,.ph label{background-color:var(--g2);border-radius:18px;box-shadow:var(--spec)}
.av{box-shadow:var(--spec),0 6px 18px rgba(0,0,0,.4)}

/* top bar (inside pushed screens) + sticky CTA */
.nb{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:0;box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
.cta{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* sheets & alerts */
.bd{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sh{background:linear-gradient(170deg,rgba(60,64,84,.62),rgba(24,26,38,.72));-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border-radius:34px 34px 0 0;box-shadow:var(--spec),0 -10px 50px rgba(0,0,0,.5)}
.gr{background:rgba(255,255,255,.35)}
.sh.as{background:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.as .grp{background:rgba(44,46,60,.7);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border-radius:28px}
.toast{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:99px;box-shadow:var(--spec),var(--lift);padding:12px 22px}

/* floating compare pill */
.cmp{bottom:calc(98px + var(--sb));background:linear-gradient(145deg,var(--b1),var(--b) 60%,var(--b2));box-shadow:inset 0 1px 0 #fffa,0 10px 30px rgba(var(--br),.4)}

/* ===== Floating bottom navigation (all screen sizes) ===== */
.tlogo{display:none!important}
.tabs{position:absolute;left:50%;right:auto;bottom:calc(12px + var(--sb));top:auto;transform:translateX(-50%);width:min(430px,calc(100% - 28px));z-index:3;
 display:flex;gap:2px;padding:6px;border:0;border-radius:99px;
 background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.1)),rgba(22,24,34,.62);
 -webkit-backdrop-filter:blur(38px) saturate(210%) brightness(1.08);backdrop-filter:blur(38px) saturate(210%) brightness(1.08);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),inset 0 0 0 .5px rgba(255,255,255,.28),inset 0 0 22px rgba(255,255,255,.06),0 18px 44px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35);
 animation:tabin .6s cubic-bezier(.2,1.04,.3,1)}
@keyframes tabin{from{transform:translate(-50%,40px) scale(.9);opacity:0}}
.tabs button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border-radius:99px;border:0;background:none;color:#c9c9d3;font-size:10px;font-weight:600;letter-spacing:.1px;cursor:pointer;transition:color .25s,transform .25s cubic-bezier(.3,1.1,.5,1)}
.tabs button svg{position:relative;z-index:1;width:25px;height:25px;transition:transform .35s cubic-bezier(.3,1.12,.5,1)}
.tabs button:active{transform:scale(.9)}
.tabs .on{color:var(--b)}
.tabs .on svg{transform:translateY(-1px) scale(1.06);filter:drop-shadow(0 0 8px rgba(var(--br),.55))}
.tabs .on:before{content:"";position:absolute;inset:0;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.3),0 2px 10px rgba(0,0,0,.3);animation:cap .45s cubic-bezier(.3,1.1,.5,1)}
@keyframes cap{from{transform:scale(.85);opacity:0}}
.tabs button:hover{color:#fff}.tabs .on:hover{color:var(--b)}
@media(min-width:900px){.tabs{width:460px}.tabs button{font-size:11px;padding:10px 4px}}

/* fallbacks */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass:rgba(34,36,48,.94)}.tabs,.nb,.cta,.sh,.chip,.srch,.btn.sec,.toast{background:rgba(34,36,48,.96)}}
@media(prefers-reduced-transparency:reduce){:root{--glass:rgba(34,36,48,.97)}.tabs,.nb,.cta,.sh,.chip,.srch,.btn.sec,.toast,.hb,.vf,.as .grp{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(34,36,48,.97)}.amb:before,.amb:after{display:none}}
@media(prefers-reduced-motion:reduce){.amb:before,.amb:after,.tabs,.tabs .on:before{animation:none}*{transition-duration:.01ms!important}}
/* ===== Motion system ===== */
:root{--spring:cubic-bezier(.32,1.1,.4,1);--ease:cubic-bezier(.22,1,.36,1);--easein:cubic-bezier(.4,0,.2,1)}
/* animations are opt-in via state classes set by render(), so re-renders never replay them */
.tabs,.bd,.sh,.ov.in{animation:none}
.tabs.boot{animation:tabin .6s var(--ease)}
.scr.fwd{animation:tabf .45s var(--ease)}.scr.bwd{animation:tabb .45s var(--ease)}
@keyframes tabf{from{opacity:0;transform:translateX(26px) scale(.99)}}@keyframes tabb{from{opacity:0;transform:translateX(-26px) scale(.99)}}
.rise{animation:rise .62s var(--ease) backwards;animation-delay:calc(var(--d,0)*38ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
/* push / pop navigation */
.ov.in{animation:ovin .52s var(--ease);box-shadow:-24px 0 60px rgba(0,0,0,.55)}
.ov.out{animation:ovout .38s var(--easein) forwards;box-shadow:-24px 0 60px rgba(0,0,0,.55);z-index:6}
@keyframes ovin{from{transform:translateX(100%)}}@keyframes ovout{to{transform:translateX(100%)}}
.under{animation:under .52s var(--ease)}@keyframes under{to{transform:translateX(-22%);opacity:.45}}
.back{animation:backin .38s var(--easein)}@keyframes backin{from{transform:translateX(-22%);opacity:.45}}
/* sheets & action sheets */
.bd.in{animation:fd .32s ease both}.bd.out{animation:fdo .32s ease forwards}@keyframes fdo{to{opacity:0}}
.sh.in{animation:shin .5s var(--ease)}.sh.out{animation:shout .32s var(--easein) forwards}
@keyframes shin{from{transform:translateY(100%)}}@keyframes shout{to{transform:translateY(105%)}}
.sh.chg>*:not(.gr){animation:fd .35s ease,rise .45s var(--ease)}
.out{pointer-events:none}
@media(min-width:900px){.sh.in{animation:popin .4s var(--ease)}.sh.out{animation:popout .26s var(--easein) forwards}
@keyframes popin{from{opacity:0;transform:translate(-50%,-44%) scale(.92)}}@keyframes popout{to{opacity:0;transform:translate(-50%,-48%) scale(.95)}}}

/* ===== v5 · iOS / iPadOS compatibility ===== */
/* side safe areas: notch / Dynamic Island in landscape on iPhone */

/* pin the document so Safari can't rubber-band or leave it offset after the keyboard closes */

/* fill the whole screen, incl. the home-indicator strip: 100dvh stops short of it on iPad (Safari & home-screen app) */
#shell{position:fixed;inset:0;width:auto;height:auto;min-height:100%}
/* whatever iOS paints past the page edge matches the app's own backdrop instead of pure black */
html,body{background:#050608}html[data-look=matte],html[data-look=matte] body{background:#0d0e11}
/* iPadOS 26 Safari stops fixed layers ~20pt short of the screen bottom, leaving a dark strip.
   The backdrop and scrollers bleed past the shell's bottom edge so content runs under it, while
   the tab bar, sheets and CTAs stay anchored to the real visible bottom. Off-screen where there's no gap. */

#shell{overflow:visible;clip-path:inset(0 0 calc(-1 * var(--bleed)) 0)}
.amb,.scr,.ov,.bd,#ob{bottom:calc(-1 * var(--bleed))}

.obp{bottom:var(--bleed)}
.nb,.cta{margin-left:calc(14px + var(--sl));margin-right:calc(14px + var(--sr))}
.tabs{width:min(430px,calc(100% - 28px - var(--sl) - var(--sr)))}

.obp{padding-left:calc(24px + var(--sl));padding-right:calc(24px + var(--sr))}

let deferred=window.__bip||null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;window.__bip=e;if(root)paint()});
addEventListener('appinstalled',()=>{put({done:1});close()});

const svg={
 share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',fwd:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v17H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 1 2-2h12"/></svg>',tabs:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="13" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v11"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.2 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
 dots:'<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
 bolt:'⚡',full:'⛶',store:'🚫'};
const ICON='icon.png';
const page=()=>`<div class="pg"><img src="${ICON}" alt=""><div class="ln l"></div><div class="ln"></div><div class="ln s"></div></div>`;
const hs=()=>`<div class="hs">${'<i></i>'.repeat(3)}<i class="me"><img src="${ICON}" alt=""><b class="ck">✓</b><em class="cf">${Array.from({length:14},(_,i)=>`<s style="--a:${i*360/14}deg;--r:${52+(i%3)*14}px"></s>`).join('')}</em><span>DriveUp</span></i>${'<i></i>'.repeat(4)}</div><div class="dock"></div>`;
const tap=(s)=>`<div class="tap" style="${s}"></div>`;

const MOCK={
ios:[
 ()=>`<div class="pwm ios">${page()}<div class="bar b"><span class="ic">${svg.back}</span><span class="ic dim">${svg.fwd}</span><span class="ic hl">${svg.share}</span><span class="ic">${svg.book}</span><span class="ic">${svg.tabs}</span></div>${tap('left:calc(50% - 15px);bottom:6px')}</div>`,
 ()=>`<div class="pwm ios">${page()}<div class="sheet"><div class="it"><span>${L('Copy','Kopieren')}</span>${svg.copy}</div><div class="it"><span>${L('Add to Bookmarks','Lesezeichen hinzufügen')}</span>${svg.star}</div><div class="it hl"><span><b>${L('Add to Home Screen','Zum Home-Bildschirm')}</b></span>${svg.plus}</div><div class="it"><span>${L('Find on Page','Auf Seite suchen')}</span><span>⌕</span></div></div>${tap('left:60%;top:140px')}</div>`,
 ()=>`<div class="pwm ios">${page()}<div class="dlg"><div class="dh"><span>${L('Cancel','Abbrechen')}</span><b>${L('Add to Home Screen','Zum Home-Bildschirm')}</b><span class="hl">${L('Add','Hinzufügen')}</span></div><div class="app"><img src="${ICON}" alt=""><div><b>DriveUp</b><br><small>${esc(location.host||'driveup.app')}</small></div></div></div>${tap('right:20px;top:58px;--dx:-60px;--dy:60px')}</div>`,
 ()=>`<div class="pwm ios">${hs()}</div>`],
android:[
 ()=>`<div class="pwm">${page()}<div class="bar t"><div class="url">🔒 ${esc(location.host||'driveup.app')}</div><span class="ic">${svg.tabs}</span><span class="ic hl">${svg.dots}</span></div>${tap('right:5px;top:9px')}</div>`,
 ()=>`<div class="pwm">${page()}<div class="bar t"><div class="url">🔒 ${esc(location.host||'driveup.app')}</div><span class="ic">${svg.tabs}</span><span class="ic">${svg.dots}</span></div><div class="menu"><div>${L('New tab','Neuer Tab')}</div><div>${L('Bookmarks','Lesezeichen')}</div><div class="hl">${L('Install app','App installieren')}</div><div>${L('Share…','Teilen…')}</div></div>${tap('left:48%;top:112px;--dx:50px;--dy:70px')}</div>`,
 ()=>`<div class="pwm">${page()}<div class="dlg"><div class="app" style="background:none;padding:2px 2px 0"><img src="${ICON}" alt=""><div><b>${L('Install app?','App installieren?')}</b><br><small>DriveUp · ${esc(location.host||'driveup.app')}</small></div></div><div class="btns"><span>${L('Cancel','Abbrechen')}</span><span class="hl">${L('Install','Installieren')}</span></div></div>${tap('right:22px;top:118px;--dx:-50px;--dy:60px')}</div>`,
 ()=>`<div class="pwm">${hs()}</div>`]};
const STEPS_=()=>({
ios:[
 [L('Tap the Share button','Tippe auf „Teilen“'),L('In Safari, tap the Share icon – the square with an arrow – in the bar at the bottom.','Tippe in Safari unten in der Leiste auf das Teilen-Symbol – das Quadrat mit dem Pfeil.')],
 [L('Choose “Add to Home Screen”','Wähle „Zum Home-Bildschirm“'),L('Scroll down in the menu if you don’t see it right away.','Scrolle im Menü nach unten, falls du es nicht gleich siehst.')],
 [L('Confirm with “Add”','Bestätige mit „Hinzufügen“'),L('Tap Add at the top right. You can keep or change the name.','Tippe oben rechts auf Hinzufügen. Den Namen kannst du behalten oder ändern.')],
 [L('Open DriveUp from your home screen','Öffne DriveUp vom Home-Bildschirm'),L('Done! DriveUp now opens full screen, just like an app.','Fertig! DriveUp öffnet jetzt im Vollbild – wie eine echte App.')]],
android:[
 [L('Open the browser menu','Öffne das Browser-Menü'),L('In Chrome, tap the three dots at the top right.','Tippe in Chrome oben rechts auf die drei Punkte.')],
 [L('Tap “Install app”','Tippe auf „App installieren“'),L('Some phones show “Add to Home screen” instead – both do the same.','Manche Handys zeigen stattdessen „Zum Startbildschirm hinzufügen“ – beides funktioniert.')],
 [L('Confirm with “Install”','Bestätige mit „Installieren“'),L('Tap Install (or Add) in the pop-up.','Tippe im Fenster auf Installieren (oder Hinzufügen).')],
 [L('Open DriveUp from your home screen','Öffne DriveUp vom Startbildschirm'),L('Done! DriveUp now opens full screen, just like an app.','Fertig! DriveUp öffnet jetzt im Vollbild – wie eine echte App.')]]});
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let root=null,os=isIOS?'ios':'android',step=-1,dir='';
if(force&&(fp=='ios'||fp=='android'))os=fp;
const isSafari=!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);

let tk=0;
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
const setBars=(el,s)=>el.querySelectorAll('.pwbar i').forEach((x,j)=>x.classList.toggle('on',j<=s));
const setSeg=(el,o)=>{const g=el.querySelector('.pwseg');if(!g)return;const pl=g.querySelector('.pwpill');if(pl)pl.style.transform=o=='android'?'translateX(100%)':'translateX(0%)';g.querySelectorAll('button').forEach(b=>{const on=b.dataset.v==o;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})};
function paint(){
 if(!root)return;
 const steps=STEPS_()[os],n=steps.length,p=root.querySelector('.pwp');
 const old=p.querySelector('.pwi'),hadBars=!!(old&&old.querySelector('.pwbar'));
 const seg=`<div class="pwseg" role="tablist"><i class="pwpill" style="transform:translateX(${os=='android'?100:0}%)"></i>${[['ios','iPhone'],['android','Android']].map(x=>`<button role="tab" aria-selected="${os==x[0]}" class="${os==x[0]?'on':''}" data-pw="os" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
 let h;
 if(step<0){
  const native=os=='android'&&deferred;
  h=`<div class="pwi"><img class="pwlg" src="${ICON}" alt="DriveUp">
  <h2>${L('Get the','Hol dir die')} <em>${L('DriveUp app','DriveUp-App')}</em></h2>
  <p class="pws">${L('Add DriveUp to your home screen. It opens full screen and starts with one tap – no app store needed.','Füge DriveUp zu deinem Startbildschirm hinzu. Es öffnet im Vollbild und startet mit einem Tipp – ohne App Store.')}</p>
  <ul class="pwb"><li><b>${svg.bolt}</b><div>${L('Opens instantly','Öffnet sofort')}<span>${L('One tap from your home screen','Ein Tipp vom Startbildschirm')}</span></div></li><li><b>${svg.full}</b><div>${L('Full-screen experience','Vollbild-Erlebnis')}<span>${L('No browser bars in the way','Keine Browser-Leisten im Weg')}</span></div></li><li><b>${svg.store}</b><div>${L('No download, no store','Kein Download, kein Store')}<span>${L('Takes about 10 seconds','Dauert ca. 10 Sekunden')}</span></div></li></ul>
  <button class="btn" data-pw="${native?'native':'go'}">${native?L('Install now','Jetzt installieren'):L('Show me how','Zeig mir wie')}</button>
  ${native?`<button class="pwg" data-pw="go">${L('Show manual steps','Schritte ansehen')}</button>`:''}
  <button class="pwg" data-pw="skip">${L('Continue in browser','Im Browser fortfahren')}</button></div>`;
 }else{
  const s=steps[step],last=step==n-1;
  h=`<div class="pwi"><div class="pwtop pwst"><button class="pwk" data-pw="back" aria-label="${L('Back','Zurück')}">‹</button>${seg}<button class="pwk" data-pw="skip" aria-label="${L('Close','Schließen')}">×</button></div>
  <div class="pwbar">${steps.map((_,i)=>`<i class="${i<=(hadBars?step:-1)?'on':''}"></i>`).join('')}</div>
  ${MOCK[os][step]()}
  <div class="pwn">${L('Step','Schritt')} ${step+1} / ${n}</div><h3>${s[0]}</h3><p class="pwd">${s[1]}</p>
  ${os=='ios'&&step==0&&!isSafari?`<div class="pwtip"><span>💡</span><span>${L('Not in Safari? Tap Share there too – or open this page in Safari.','Nicht in Safari? Tippe auch dort auf Teilen – oder öffne diese Seite in Safari.')}</span></div>`:''}
  <div class="pwrow">${step>0?`<button class="btn sec" data-pw="prev">${L('Back','Zurück')}</button>`:''}<button class="btn" data-pw="${last?'done':'next'}">${last?L('Got it – let’s go','Verstanden – los geht’s'):L('Next','Weiter')}</button></div></div>`;
 }
 const k=os+'|'+step+'|'+lang()+'|'+(deferred?1:0);
 if(p.dataset.k===k)return;
 p.dataset.k=k;
 const kind=dir||'o';dir='';const my=++tk;
 const swap=()=>{
  if(my!==tk||!root)return;
  p.className='pwp'+(old?' psw ps'+kind:'');p.innerHTML=h;p.scrollTop=0;
  if(!hadBars&&step>=0){void p.offsetWidth;setBars(p,step)} /* progress bar fills in from empty */
  const b=p.querySelector('.btn');if(b)try{b.focus({preventScroll:true})}catch(e){}
 };
 if(old&&!RM()){
  setSeg(old,os);if(hadBars)setBars(old,step); /* pill + progress move right away, while the content slides out */
  old.className='pwi px'+kind;setTimeout(swap,130);
 }else swap();
}
function open(){
 if(root)return;
 root=document.createElement('div');root.id='pwa';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label',L('Install DriveUp','DriveUp installieren'));
 root.innerHTML='<div class="pwp"></div>';document.body.appendChild(root);paint();
 root.addEventListener('click',e=>{
  const t=e.target.closest('[data-pw]');if(!t)return;const a=t.dataset.pw;
  if(a=='os'){os=t.dataset.v;dir='';paint()}
  else if(a=='go'){step=0;dir='f';paint()}
  else if(a=='next'){step++;dir='f';paint()}
  else if(a=='prev'||a=='back'){dir='b';step=Math.max(-1,step-1);paint()}
  else if(a=='native'){deferred.prompt();deferred.userChoice.then(r=>{deferred=null;window.__bip=null;if(r.outcome=='accepted'){put({done:1});close()}else paint()}).catch(()=>{})}
  else if(a=='done'){put({done:1});close();try{window.close()}catch(e){try{window.top.close()}catch(e2){}}}
  else if(a=='skip'){put({t:Date.now()});close()}
 });
 addEventListener('keydown',esc_);
}
function esc_(e){if(e.key=='Escape'&&root){put({t:Date.now()});close()}}
function close(){if(!root)return;const r=root;root=null;removeEventListener('keydown',esc_);r.classList.add('out');setTimeout(()=>r.remove(),300)}

const eligible=()=>force||((isIOS||isAnd)&&!standalone()&&!snoozed());
window.DriveUpInstall={show:(platform)=>{if(platform==='ios'||platform==='android')os=platform;step=-1;dir='';if(root){close();setTimeout(open,40)}else open()},reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}}};
if(eligible()){
 const go=()=>setTimeout(()=>{if(eligible())open()},force?500:3100); /* after the splash */
 document.readyState=='complete'?go():addEventListener('load',go);
}
})();
</script></body></html>
